plugins {
    id 'com.android.application'
}

def keystoreFile = rootProject.file('app/keystore/zaiapi.keystore')

android {
    namespace 'com.zaiapi.android'
    compileSdk 35

    defaultConfig {
        applicationId "com.zaiapi.android"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        // R8 全量优化（体积优先）；反射/JS 桥接点的保留见 proguard-rules.pro
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'ds2api123'
                keyAlias 'ds2api'
                keyPassword 'ds2api123'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            // 释放到 nativeLibraryDir 后需要 chmod + exec，交给系统安装器解压
            useLegacyPackaging true
        }
        resources {
            // 去掉产物里的 kotlin_module 元数据（仅编译期用，运行时不需要）
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Material 3 Expressive 组件库（1.13+ 提供 M3 Expressive 主题与组件）
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.transition:transition:1.5.0'
}
